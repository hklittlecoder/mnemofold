[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemofold"
dynamic = ["version"]
description = "Offline long-term memory framework for personal agents and work assistants"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Yuan Hongbo", email = "242467398+hklittlecoder@users.noreply.github.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "build>=1.2",
  "hatchling>=1.25",
]

[project.scripts]
mnemofold = "mnemofold.cli:main"

[tool.hatch.version]
path = "src/mnemofold/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemofold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "model: marks tests that depend on torch / model training",
]

[tool.mypy]
files = ["src/mnemofold"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
disallow_any_generics = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
